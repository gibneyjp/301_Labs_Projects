<html>
    <head>
        <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Promise, fetch and API</title>
    </head>
    <body>
        <h1>Lab 14</h1>
        <p> Random Generated Users</p>
        <div style="border: 5px solid lightgray; padding: 20px; text-align: center;">
            <img id="picture" width="100" height="100" alt="User profile picture">
            <h2 id="name"></h2>
            <p id="email"></p>
            <p id="phone"></p>
        </div>
        <button id="button">Get a new user</button>
        <script>
            const site = 'https://randomuser.me/api/';

            const getUser = async () => {
                try {
                    const response = await fetch(site);
                    const data = await response.json();
                    const user = data.results[0];

                    document.getElementById('picture').src = user.picture.large;
                    document.getElementById('name').textContent = `${user.name.first} ${user.name.last}`;
                    document.getElementById('email').textContent = `Email: ${user.email}`;
                    document.getElementById('phone').textContent = `Phone: ${user.phone}`;
                } catch (error) {
                    console.error('Error fetching user:', error);
                }
            };
            getUser(); 
            const button = document.getElementById('button');
            button.addEventListener('click', getUser);

        </script>
    </body>
</html>
