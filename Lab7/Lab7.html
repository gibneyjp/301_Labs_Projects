<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flexbox</title>
        <style>
            #parent{
                border: 2px solid black;
                display: flex;
                height: 100vh;
            }
            #left{
                width: 100px;
                background-color: orange;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: left;
                font-size: 40px;
                margin-right: 5px;
            }
            #left #last-child{
                margin-top: auto;
            }
            #masony{
                flex: 1;
                display: flex;
                overflow-y: auto;
                flex-wrap: wrap;
                gap: 5px;
            }
            #masony img{
                flex-grow: 1;
            }
        </style>
</head>
<body id="parent">
    <div id="left">
        <div> &#x1F4F7; <br> &#x1F5C4;&#xfe0f; <br> &#x2764;&#xfe0f;</div>
        <div id="last-child"> &#x1F5D1; </div>
    </div>
