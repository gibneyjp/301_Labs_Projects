<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        p {
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>Tip Calculator</h1>
    <p>This is a simple webpage that prompts the user for the bill amount and tip percentage and calculates the total amount.</p>
    <script>
        let billAmount = Number(prompt('What is the bill amount?'));
        let tipPercentage = 10;
        let tipAmount = billAmount * (tipPercentage / 100);
        while (billAmount <= 0 || isNaN(billAmount)) {
            if (billAmount < 0) {
                document.write("Negative amounts are not allowed. Please enter a valid bill amount.");
            } if (isNaN(billAmount)) {
                document.write("Invalid input. Please enter a numeric bill amount.");
            } if (billAmount === 0) {
                document.write("Please enter a bill amount greater than zero.");
            } if (billAmount > 0) {
                let totalAmount = billAmount + tipAmount;
                document.write("The total tip is: $" + tipAmount.toFixed(2));
                document.write("The total amount is: $" + totalAmount);
            }
        }
        </script>
    </body>
</html>
