<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan - Explore Antigua</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="top">
    <!-- site header -->
    <header>
        <h1>Explore Antigua</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="things-to-do.html">Things To Do</a></li>
                <li><a href="food.html">Food</a></li>
                <li><a href="stay.html">Stay</a></li>
                <li><a href="plan.html">Plan</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- plan and form -->
        <section>
            <h2>Simple Planning List</h2>
            <ol>
                <li>Choose your travel dates.</li>
                <li>Look at places to stay.</li>
                <li>Make a short list of places you want to visit.</li>
                <li>Keep your travel documents together.</li>
            </ol>
        </section>

        <form action="#">
            <h2>Send a Question</h2>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="question">Question</label>
            <textarea id="question" name="question" rows="5" required></textarea>

            <button type="submit">Send</button>
        </form>
    </main>

    <!-- page footer -->
    <footer>
        <p>Explore Antigua</p>
    </footer>
    <a class="back-to-top" href="#top">Top</a>
</body>
